# Deterministic isolated-gravity smoke case for the order-two CPU FMM.
simulation(particle_count=512, dt=0.0005, solver=fmm_cpu, integrator=euler)
performance(profile=custom)
octree(theta=0.5, softening=0.05, criterion=com, theta_auto=false, leaf_capacity=32)
treepm(enabled=false, model=exact_tree, local_grid=false)
physics(max_acceleration=256, min_softening=0.0001, min_distance2=1e-12, min_theta=0.05)
generation(seed=24680, deterministic=true, include_central_body=false)
scene(style=preset, preset=random_cloud, mode=random_cloud, file="", format=auto)
cloud(half_extent=10, cube_half_extent=10, sphere_radius=10, speed=0, particle_mass=0.01)
