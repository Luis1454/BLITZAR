# Deterministic PM-only cosmology smoke case. Positions are comoving in [0,L)^3.
simulation(particle_count=4096, dt=0.002, solver=octree_cpu, integrator=leapfrog)
treepm(enabled=true, model=pm_only, grid_size=32, assignment=tsc, local_grid=false)
# The comoving KDK path bypasses this legacy isolated-solver guard; it remains positive only
# to preserve compatibility with the generic configuration validator.
physics(max_acceleration=64, min_softening=0.0001, min_distance2=1e-12, min_theta=0.05)
scene(style=detailed, preset=cosmology, mode=cosmology, file="", format=auto)
generation(seed=42, deterministic=true)
cloud(particle_mass=0.01)
cosmology(enabled=true, mode=comoving, geometry=cube, box_half_extent=32, sphere_radius=32, h0=0.003, omega_m=1, omega_lambda=0, omega_radiation=0, initial_scale_factor=0.1, perturbation=0.001, peculiar_velocity=1, mass_model=particle_mass, total_mass=0)
