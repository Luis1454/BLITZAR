name: macos-build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-cpu:
    name: macOS CPU Build (macos-14 / clang)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install native dependencies
        run: brew install ninja libomp qt
      - name: Configure product
        run: cmake --preset macos-dev -DCMAKE_PREFIX_PATH="$(brew --prefix libomp);$(brew --prefix qt)"
      - name: Build CPU product
        run: >-
          cmake --build --preset macos-dev --parallel --target
          blitzar-gui blitzar-headless blitzar-server blitzar-client blitzarClientModuleQtInProc
      - name: Configure integration tests
        run: cmake --preset integration-safe
        working-directory: tests
      - name: Build integration tests
        run: cmake --build --preset integration-safe --parallel
        working-directory: tests
      - name: Run deterministic integration tests
        run: ctest --preset integration-safe --output-on-failure --timeout 180 --no-tests=error -R "TST_UNT_CONF_|TST_QLT_REPO_00(1|2|3|4|6|7)_"
        working-directory: tests
