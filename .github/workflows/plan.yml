name: Plan Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BLITZAR_CI_BUILD_ROOT: ${{ github.workspace }}/../blitzar-build

jobs:
  validate:
    name: Validate frozen plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: python -m pip install clang-format==22.1.8

      - name: Run manifest-defined structural gates
        run: python -m tools.gates.quality_gate --root . --group static

      - name: Record workspace inventory
        shell: bash
        run: python -m tools.gates.workspace_gate --root . --check --output "$RUNNER_TEMP/workspace-report.json"

      - name: Reject unapproved plan edits
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if grep -Eq '^(PLAN\.md|plan/manifest\.json)$' <<< "$changed"; then
            messages=$(git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
            if ! grep -q '^plan-change:' <<< "$messages"; then
              echo "Plan files changed without a plan-change commit."
              exit 1
            fi
            if ! grep -Eq '^plan/decisions/[^/]+\.md$' <<< "$changed"; then
              echo "Plan changes require a decision record under plan/decisions/."
              exit 1
            fi
          fi

  build:
    name: Build and test static target
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure static build
        run: cmake -S . -B "$env:BLITZAR_CI_BUILD_ROOT/static" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLITZAR_BUILD_TESTS=ON -DBLITZAR_BUILD_CLI=ON -DBLITZAR_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build "$env:BLITZAR_CI_BUILD_ROOT/static" --config Release

      - name: Test
        run: ctest --test-dir "$env:BLITZAR_CI_BUILD_ROOT/static" --output-on-failure -C Release

  shared-public:
    name: Build shared public consumers
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure shared build
        run: cmake -S . -B "$env:BLITZAR_CI_BUILD_ROOT/shared" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLITZAR_BUILD_SHARED=ON -DBLITZAR_BUILD_TESTS=OFF -DBLITZAR_BUILD_CLI=ON -DBLITZAR_BUILD_EXAMPLES=ON

      - name: Build shared library and consumers
        run: cmake --build "$env:BLITZAR_CI_BUILD_ROOT/shared" --config Release

      - name: Qualify installed shared package consumer
        run: cmake "-DBLITZAR_BUILD_DIR=$env:BLITZAR_CI_BUILD_ROOT/shared" -P tests/package/package_consumer.cmake

  sanitizers:
    name: Linux Clang sanitizers
    runs-on: ubuntu-latest
    needs: validate
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenMP runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libomp-dev

      - name: Configure sanitizer build
        shell: bash
        run: |
          CC=clang CXX=clang++ cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/sanitizers" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBLITZAR_ENABLE_SANITIZERS=ON \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=ON \
            -DBLITZAR_BUILD_EXAMPLES=ON

      - name: Build sanitizer target
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/sanitizers" --parallel

      - name: Run sanitizer tests
        run: ctest --test-dir "$BLITZAR_CI_BUILD_ROOT/sanitizers" --output-on-failure

  linux-debug:
    name: Linux debugger qualification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GDB toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb ninja-build

      - name: Record debugger capability
        shell: bash
        run: |
          capability="$(python -m tools.debug.debug_runner --backend gdb --capability)"
          {
            echo "## Capability record"
            while IFS= read -r line; do echo "- $line"; done <<< "$capability"
            echo "- backend: CPU Debug"
            echo "- device: none required"
            echo "- skip reason: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure debugger build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/linux-debug" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_ENABLE_SANITIZERS=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build debugger probes
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/linux-debug" --target blitzar_numerical_test blitzar_allocation_test blitzar_debug_status_probe --parallel

      - name: Run numerical test under debugger
        shell: bash
        run: python -m tools.debug.debug_runner --backend gdb --timeout 120 "$BLITZAR_CI_BUILD_ROOT/linux-debug/blitzar_numerical_test"

      - name: Run allocation test under debugger
        shell: bash
        run: python -m tools.debug.debug_runner --backend gdb --timeout 120 "$BLITZAR_CI_BUILD_ROOT/linux-debug/blitzar_allocation_test"

      - name: Verify non-zero child status under debugger
        shell: bash
        run: python -m tools.debug.debug_runner --backend gdb --expected-exit-code 7 --timeout 120 "$BLITZAR_CI_BUILD_ROOT/linux-debug/blitzar_debug_status_probe"

  windows-debug:
    name: Windows CDB debug qualification
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate CDB
        shell: pwsh
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits",
            "$env:ProgramFiles\Windows Kits"
          )
          $debugger = Get-ChildItem -Path $roots -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('cdb.exe', 'cdbX64.exe') -and
                $_.FullName -match '\\Debuggers\\x64\\cdb(X64)?\.exe$'
            } |
            Select-Object -First 1
          if ($null -eq $debugger) {
            throw "CDB was not found in the installed Windows SDKs"
          }
          "BLITZAR_DEBUGGER=cdb" >> $env:GITHUB_ENV
          "BLITZAR_DEBUGGER_PATH=$($debugger.FullName)" >> $env:GITHUB_ENV

      - name: Record debugger capability
        shell: pwsh
        run: |
          $capability = python -m tools.debug.debug_runner --backend cdb --capability
          Add-Content $env:GITHUB_STEP_SUMMARY "## Capability record"
          $capability | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- $_" }
          Add-Content $env:GITHUB_STEP_SUMMARY "- backend: CPU Debug"
          Add-Content $env:GITHUB_STEP_SUMMARY "- device: none required"
          Add-Content $env:GITHUB_STEP_SUMMARY "- skip reason: none"

      - name: Configure debugger build
        shell: pwsh
        run: |
          cmake -S . -B "$env:BLITZAR_CI_BUILD_ROOT/windows-debug" -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBLITZAR_HIP_MODE=OFF `
            -DBLITZAR_MPI_MODE=OFF `
            -DBLITZAR_ENABLE_OPENMP=OFF `
            -DBLITZAR_ENABLE_SANITIZERS=OFF `
            -DBLITZAR_BUILD_TESTS=ON `
            -DBLITZAR_BUILD_CLI=OFF `
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build debugger probes
        run: cmake --build "$env:BLITZAR_CI_BUILD_ROOT/windows-debug" --target blitzar_numerical_test blitzar_allocation_test blitzar_debug_status_probe --parallel

      - name: Run numerical test under debugger
        run: python -m tools.debug.debug_runner --backend cdb --timeout 120 "$env:BLITZAR_CI_BUILD_ROOT/windows-debug/blitzar_numerical_test.exe"

      - name: Run allocation test under debugger
        run: python -m tools.debug.debug_runner --backend cdb --timeout 120 "$env:BLITZAR_CI_BUILD_ROOT/windows-debug/blitzar_allocation_test.exe"

      - name: Verify non-zero child status under debugger
        run: python -m tools.debug.debug_runner --backend cdb --expected-exit-code 7 --timeout 120 "$env:BLITZAR_CI_BUILD_ROOT/windows-debug/blitzar_debug_status_probe.exe"

  macos-debug:
    name: macOS LLDB debug qualification
    runs-on: macos-15-intel
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record debugger capability
        shell: bash
        run: |
          capability="$(python3 -m tools.debug.debug_runner --backend lldb --capability)"
          {
            echo "## Capability record"
            while IFS= read -r line; do echo "- $line"; done <<< "$capability"
            echo "- backend: CPU Debug"
            echo "- device: none required"
            echo "- skip reason: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure debugger build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/macos-debug" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_ENABLE_SANITIZERS=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build debugger probes
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/macos-debug" --target blitzar_numerical_test blitzar_allocation_test blitzar_debug_status_probe --parallel

      - name: Run numerical test under debugger
        shell: bash
        run: python3 -m tools.debug.debug_runner --backend lldb --timeout 120 "$BLITZAR_CI_BUILD_ROOT/macos-debug/blitzar_numerical_test"

      - name: Run allocation test under debugger
        shell: bash
        run: python3 -m tools.debug.debug_runner --backend lldb --timeout 120 "$BLITZAR_CI_BUILD_ROOT/macos-debug/blitzar_allocation_test"

      - name: Verify non-zero child status under debugger
        shell: bash
        run: python3 -m tools.debug.debug_runner --backend lldb --expected-exit-code 7 --timeout 120 "$BLITZAR_CI_BUILD_ROOT/macos-debug/blitzar_debug_status_probe"

  static-analysis:
    name: Clang static analysis
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy libomp-dev

      - name: Configure compilation database
        shell: bash
        run: |
          CC=clang CXX=clang++ cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/analysis" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_BUILD_TESTS=OFF \
            -DBLITZAR_BUILD_CLI=ON \
            -DBLITZAR_BUILD_EXAMPLES=ON

      - name: Run clang-tidy
        shell: bash
        run: |
          mapfile -t sources < <(find src -type f -name '*.cpp' -print)
          clang-tidy -p "$BLITZAR_CI_BUILD_ROOT/analysis" \
            --checks='-*,clang-analyzer-*' \
            --warnings-as-errors='*' \
            "${sources[@]}"

  cpu-only:
    name: Linux CPU-only contract
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record capability
        shell: bash
        run: |
          {
            echo "## Capability record"
            echo "- toolchain: $(c++ --version | head -n 1)"
            echo "- backend: CPU"
            echo "- device: none required"
            echo "- rank count: 1"
            echo "- skip reason: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure CPU-only build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/cpu" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=ON \
            -DBLITZAR_BUILD_EXAMPLES=ON

      - name: Build CPU-only target
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/cpu" --parallel

      - name: Run CPU-only tests
        run: ctest --test-dir "$BLITZAR_CI_BUILD_ROOT/cpu" --exclude-regex '^TST-P2-004$' --output-on-failure

  package-consumer:
    name: Install-prefix package consumer
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record capability
        shell: bash
        run: |
          {
            echo "## Capability record"
            echo "- toolchain: $(c++ --version | head -n 1)"
            echo "- backend: CPU-only package"
            echo "- device: none required"
            echo "- rank count: 1"
            echo "- skip reason: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure package build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/package" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_BUILD_TESTS=OFF \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build package target
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/package" --parallel

      - name: Configure and build external consumer
        shell: bash
        run: cmake -DBLITZAR_BUILD_DIR="$BLITZAR_CI_BUILD_ROOT/package" -P tests/package/package_consumer.cmake

  mpi-ranks:
    name: MPI two and four rank qualification
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin ninja-build

      - name: Record capability
        shell: bash
        run: |
          {
            echo "## Capability record"
            echo "- toolchain: $(mpicxx --version | head -n 1)"
            echo "- backend: MPI + CPU"
            echo "- device: hosted CPU runner"
            echo "- rank count: 2 and 4"
            echo "- topology: one runner, multi-rank only; multi-node qualification is not claimed"
            echo "- skip reason: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure MPI build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/mpi" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=ON \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build MPI target
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/mpi" --parallel

      - name: Qualify installed MPI package consumer
        shell: bash
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: cmake -DBLITZAR_BUILD_DIR="$BLITZAR_CI_BUILD_ROOT/mpi" -P tests/package/package_consumer.cmake

      - name: Run two and four rank tests with timeout
        shell: bash
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          timeout --foreground 240s ctest --test-dir "$BLITZAR_CI_BUILD_ROOT/mpi" \
            --output-on-failure \
            -R '^(TST-P7-001|TST-P7-002|TST-P7-003|TST-P7-004|TST-P7-005|TST-P8-001|TST-P8-002)$'

  release-evidence:
    name: Reproducible scaling evidence
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MPI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenmpi-dev openmpi-bin ninja-build

      - name: Configure evidence build
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/evidence" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBLITZAR_HIP_MODE=OFF \
            -DBLITZAR_MPI_MODE=ON \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Build evidence probes
        run: |
          cmake --build "$BLITZAR_CI_BUILD_ROOT/evidence" \
            --target blitzar_scaling_test blitzar_accelerator_test --parallel

      - name: Run reproducible evidence matrix
        shell: bash
        env:
          OMPI_ALLOW_RUN_AS_ROOT: "1"
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          timeout --foreground 900s python -m tools.evidence.release_evidence \
            --root . \
            --build-dir "$BLITZAR_CI_BUILD_ROOT/evidence" \
            --output "$RUNNER_TEMP/blitzar-evidence" \
            --strict

      - name: Publish evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitzar-reproducible-evidence
          path: ${{ runner.temp }}/blitzar-evidence
          if-no-files-found: warn

  native-cuda:
    name: Native CUDA compile and optional device test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe CUDA capability
        id: probe
        shell: bash
        run: |
          nvcc_path="$(command -v nvcc || true)"
          device_name=""
          if [[ -n "$nvcc_path" ]]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            if command -v nvidia-smi >/dev/null 2>&1; then
              device_name="$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -n 1 || true)"
            fi
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$device_name" ]]; then
            echo "device=true" >> "$GITHUB_OUTPUT"
            skip_reason="none"
          elif [[ -n "$nvcc_path" ]]; then
            echo "device=false" >> "$GITHUB_OUTPUT"
            skip_reason="CUDA compiler available, but no NVIDIA device is exposed"
          else
            echo "device=false" >> "$GITHUB_OUTPUT"
            skip_reason="nvcc unavailable on this runner"
          fi
          {
            echo "## Capability record"
            echo "- toolchain: ${nvcc_path:-unavailable}"
            echo "- backend: native CUDA through HIP compatibility"
            echo "- device: ${device_name:-unavailable}"
            echo "- rank count: 1"
            echo "- skip reason: ${skip_reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure native CUDA build
        if: steps.probe.outputs.compile == 'true'
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/cuda" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_PLATFORM=nvidia \
            -DBLITZAR_HIP_MODE=ON \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Compile native CUDA target
        if: steps.probe.outputs.compile == 'true'
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/cuda" --parallel

      - name: Qualify installed native CUDA package consumer
        if: steps.probe.outputs.compile == 'true'
        shell: bash
        run: cmake -DBLITZAR_BUILD_DIR="$BLITZAR_CI_BUILD_ROOT/cuda" -P tests/package/package_consumer.cmake

      - name: Run CUDA device qualification
        if: steps.probe.outputs.device == 'true'
        run: timeout --foreground 180s ctest --test-dir "$BLITZAR_CI_BUILD_ROOT/cuda" -R '^TST-P4-001$' --output-on-failure

  hip:
    name: HIP compile and optional device test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe HIP capability
        id: probe
        shell: bash
        run: |
          hipcc_path="$(command -v hipcc || true)"
          device_name=""
          if [[ -n "$hipcc_path" ]]; then
            if command -v rocm-smi >/dev/null 2>&1; then
              device_name="$(rocm-smi --showproductname 2>/dev/null | head -n 1 || true)"
            elif command -v rocminfo >/dev/null 2>&1 && rocminfo 2>/dev/null | grep -Eq 'gfx[0-9]+'; then
              device_name="AMD GPU exposed by rocminfo"
            fi
            echo "compile=true" >> "$GITHUB_OUTPUT"
          else
            echo "compile=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$device_name" ]]; then
            echo "device=true" >> "$GITHUB_OUTPUT"
            skip_reason="none"
          elif [[ -n "$hipcc_path" ]]; then
            echo "device=false" >> "$GITHUB_OUTPUT"
            skip_reason="HIP compiler available, but no AMD device is exposed"
          else
            echo "device=false" >> "$GITHUB_OUTPUT"
            skip_reason="hipcc unavailable on this runner"
          fi
          {
            echo "## Capability record"
            echo "- toolchain: ${hipcc_path:-unavailable}"
            echo "- backend: HIP"
            echo "- device: ${device_name:-unavailable}"
            echo "- rank count: 1"
            echo "- skip reason: ${skip_reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure HIP build
        if: steps.probe.outputs.compile == 'true'
        shell: bash
        run: |
          cmake -S . -B "$BLITZAR_CI_BUILD_ROOT/hip" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_PLATFORM=amd \
            -DBLITZAR_HIP_MODE=ON \
            -DBLITZAR_MPI_MODE=OFF \
            -DBLITZAR_ENABLE_OPENMP=OFF \
            -DBLITZAR_BUILD_TESTS=ON \
            -DBLITZAR_BUILD_CLI=OFF \
            -DBLITZAR_BUILD_EXAMPLES=OFF

      - name: Compile HIP target
        if: steps.probe.outputs.compile == 'true'
        run: cmake --build "$BLITZAR_CI_BUILD_ROOT/hip" --parallel

      - name: Qualify installed HIP package consumer
        if: steps.probe.outputs.compile == 'true'
        shell: bash
        run: cmake -DBLITZAR_BUILD_DIR="$BLITZAR_CI_BUILD_ROOT/hip" -P tests/package/package_consumer.cmake

      - name: Run HIP device qualification
        if: steps.probe.outputs.device == 'true'
        run: timeout --foreground 180s ctest --test-dir "$BLITZAR_CI_BUILD_ROOT/hip" -R '^TST-P4-001$' --output-on-failure

  final-audit:
    name: Final repository qualification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
      - shared-public
      - sanitizers
      - linux-debug
      - windows-debug
      - macos-debug
      - static-analysis
      - cpu-only
      - package-consumer
      - mpi-ranks
      - release-evidence
      - native-cuda
      - hip
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: python -m pip install clang-format==22.1.8

      - name: Generate strict final audit
        shell: bash
        env:
          BLITZAR_LANE_VALIDATE: ${{ needs['validate'].result }}
          BLITZAR_LANE_BUILD: ${{ needs['build'].result }}
          BLITZAR_LANE_SHARED_PUBLIC: ${{ needs['shared-public'].result }}
          BLITZAR_LANE_SANITIZERS: ${{ needs['sanitizers'].result }}
          BLITZAR_LANE_LINUX_DEBUG: ${{ needs['linux-debug'].result }}
          BLITZAR_LANE_WINDOWS_DEBUG: ${{ needs['windows-debug'].result }}
          BLITZAR_LANE_MACOS_DEBUG: ${{ needs['macos-debug'].result }}
          BLITZAR_LANE_STATIC_ANALYSIS: ${{ needs['static-analysis'].result }}
          BLITZAR_LANE_CPU_ONLY: ${{ needs['cpu-only'].result }}
          BLITZAR_LANE_PACKAGE_CONSUMER: ${{ needs['package-consumer'].result }}
          BLITZAR_LANE_MPI_RANKS: ${{ needs['mpi-ranks'].result }}
          BLITZAR_LANE_RELEASE_EVIDENCE: ${{ needs['release-evidence'].result }}
          BLITZAR_LANE_NATIVE_CUDA: ${{ needs['native-cuda'].result }}
          BLITZAR_LANE_HIP: ${{ needs['hip'].result }}
        run: |
          python -m tools.audit.audit_final \
            --root . \
            --output "$RUNNER_TEMP/blitzar-final-audit" \
            --strict \
            --run-gates

      - name: Publish final audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitzar-final-audit
          path: ${{ runner.temp }}/blitzar-final-audit
          if-no-files-found: warn
