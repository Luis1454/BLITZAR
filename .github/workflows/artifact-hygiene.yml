name: Artifact Hygiene

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove Expired Artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Delete expired artifacts and verify inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/ci/audit_github_artifacts.py
          --repo "$GITHUB_REPOSITORY"
          --token "$GITHUB_TOKEN"
          --delete-expired
          --fail-on-expired
          --fail-on-stale
          --fail-on-unclassified
